name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-gui-x86_64:
    name: Build Linux GUI x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglx-mesa0 libglib2.0-0 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-image0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build GUI executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-linux
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt.spec
          mv dist/chat-over-dnstt dist/chat-over-dnstt-gui-linux-x86_64
          chmod +x dist/chat-over-dnstt-gui-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-gui-linux-x86_64
          path: dist/chat-over-dnstt-gui-linux-x86_64

  build-linux-tui-x86_64:
    name: Build Linux TUI x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build TUI executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-linux-tui
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt_tui.spec
          mv dist/chat-over-dnstt-tui dist/chat-over-dnstt-tui-linux-x86_64
          chmod +x dist/chat-over-dnstt-tui-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-tui-linux-x86_64
          path: dist/chat-over-dnstt-tui-linux-x86_64

  build-macos-gui-arm64:
    name: Build macOS GUI arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          test "$arch" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build GUI executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-macos
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt.spec
          mv dist/chat-over-dnstt dist/chat-over-dnstt-gui-macos-arm64
          chmod +x dist/chat-over-dnstt-gui-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-gui-macos-arm64
          path: dist/chat-over-dnstt-gui-macos-arm64

      - name: Prepare slipstream-client artifact
        run: |
          cp slipstream/slipstream-client slipstream-client-macos-arm64
          chmod +x slipstream-client-macos-arm64

      - name: Upload slipstream-client artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-client-macos-arm64
          path: slipstream-client-macos-arm64

  build-macos-tui-arm64:
    name: Build macOS TUI arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          test "$arch" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build TUI executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-macos-tui
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt_tui.spec
          mv dist/chat-over-dnstt-tui dist/chat-over-dnstt-tui-macos-arm64
          chmod +x dist/chat-over-dnstt-tui-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-tui-macos-arm64
          path: dist/chat-over-dnstt-tui-macos-arm64

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-gui-x86_64
      - build-linux-tui-x86_64
      - build-macos-gui-arm64
      - build-macos-tui-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-gui-linux-x86_64
          path: release-assets

      - name: Download Linux TUI artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-tui-linux-x86_64
          path: release-assets

      - name: Download macOS GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-gui-macos-arm64
          path: release-assets

      - name: Download macOS TUI artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-tui-macos-arm64
          path: release-assets

      - name: Download macOS slipstream artifact
        uses: actions/download-artifact@v4
        with:
          name: slipstream-client-macos-arm64
          path: release-assets

      - name: Create release zip
        run: |
          cp install.sh release-assets/
          cd release-assets && zip -r "../chat-over-dnstt-${{ github.ref_name }}.zip" . && cd ..

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/chat-over-dnstt-gui-linux-x86_64
            release-assets/chat-over-dnstt-tui-linux-x86_64
            release-assets/chat-over-dnstt-gui-macos-arm64
            release-assets/chat-over-dnstt-tui-macos-arm64
            release-assets/slipstream-client-macos-arm64
            install.sh
            chat-over-dnstt-${{ github.ref_name }}.zip
