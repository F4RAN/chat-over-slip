name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-linux
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt.spec
          mv dist/chat-over-dnstt dist/chat-over-dnstt-linux-x86_64
          chmod +x dist/chat-over-dnstt-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-linux-x86_64
          path: dist/chat-over-dnstt-linux-x86_64

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          test "$arch" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-macos
        run: |
          pyinstaller --noconfirm --clean build/chat_over_dnstt.spec
          mv dist/chat-over-dnstt dist/chat-over-dnstt-macos-arm64
          chmod +x dist/chat-over-dnstt-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-over-dnstt-macos-arm64
          path: dist/chat-over-dnstt-macos-arm64

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-x86_64
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-linux-x86_64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-over-dnstt-macos-arm64
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/chat-over-dnstt-linux-x86_64
            release-assets/chat-over-dnstt-macos-arm64
