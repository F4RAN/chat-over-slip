<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat over DNSTT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    #header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; }
    .bubble.own { align-self: flex-end; background: #0f3460; }
    .bubble.other { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; }
    .bubble .meta { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .bubble .body { font-size: 0.95rem; line-height: 1.4; }
    .bubble .body[dir="rtl"] { text-align: right; direction: rtl; }
    .bubble.pending { opacity: 0.8; }
    #input-area { padding: 12px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
    #input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 14px; }
    #input:focus { outline: none; border-color: #e94560; }
    #send { padding: 10px 20px; border-radius: 8px; border: none; background: #e94560; color: #fff; cursor: pointer; font-weight: 600; }
    #send:hover { background: #ff6b6b; }
    #config { padding: 12px; background: #0f3460; border-radius: 8px; margin-bottom: 12px; }
    #config input { margin: 4px 8px 4px 0; padding: 6px 10px; border-radius: 4px; border: 1px solid #16213e; background: #1a1a2e; color: #eee; }
    .file-link { color: #4fc3f7; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div id="header">
    <strong>Chat over DNSTT</strong>
    <span id="status" style="margin-left:12px;color:#888;">Disconnected</span>
  </div>
  <div id="config" style="display:none;">
    <input id="host" placeholder="Host" />
    <input id="domain" placeholder="Domain (DNS)" />
    <input id="user" placeholder="User" />
    <input id="pass" type="password" placeholder="Password" />
    <input id="mode" placeholder="ssh or dns" value="ssh" />
    <button id="connect">Connect</button>
  </div>
  <div id="chat"></div>
  <div id="input-area">
    <input id="input" placeholder="Message or /upload /download /news" />
    <button id="send">Send</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
